<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 56 - Kapral</title>
    <style>
        body { font-family: monospace; }
    </style>
    <script language="JavaScript">
        // Antoni Kapral 3F - 2.8.2025
        // Zadanie 56 - Liczby pierwsze ze wzoru W(i)=i^2+i+41
        
        document.write("<h2>Zadanie 56 - Antoni Kapral</h2>");
        
        for(i_kap=0; i_kap<=39; i_kap++) {
            var wynik_kap = i_kap * i_kap + i_kap + 41;
            document.write("i=" + i_kap + "&nbsp;&nbsp;&nbsp;&nbsp;W(" + i_kap + ")=" + wynik_kap + "<br>");
        }
        
        function okno_zamknij_kapral() {
            window.close();
        }
    </script>
</head>
<body>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/>
</body>
</html>
