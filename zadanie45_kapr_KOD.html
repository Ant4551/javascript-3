<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="utf-8">
    <title>Kod Zadania 45 - Kapral</title>
    <script language="JavaScript">
        function okno_zamknij_kapral() {
            window.close();
        }
    </script>
</head>
<body>
    <h2>Kod programu - Zadanie 45</h2>
    <textarea cols="90" rows="30">
&lt;!DOCTYPE html&gt;
&lt;html lang="pl-PL"&gt;
&lt;head&gt;
    &lt;title&gt;Zadanie 45 - Kapral&lt;/title&gt;
    &lt;meta charset="utf-8"&gt;
    &lt;script language="JavaScript"&gt;
// Antoni Kapral 3F - 2.8.2025
// Zadanie 45 - Sprawdzanie parzystości wczytanej liczby

var liczba_liter_nazwiska = 6; // KAPRAL = 6 liter
var ile_razy_kap = (liczba_liter_nazwiska % 4) + 10;
var wielkosc_liter_kap = (liczba_liter_nazwiska % 3) + 40;

var wczytana_kap = prompt("Podaj liczbę:", "");
var liczba_kap = parseFloat(wczytana_kap);

document.write("&lt;div style='font-size:" + wielkosc_liter_kap + "px;'&gt;");
document.write("&lt;h2&gt;Zadanie 45 - Antoni Kapral&lt;/h2&gt;");
document.write("&lt;p&gt;Wczytana liczba: " + liczba_kap + "&lt;/p&gt;");
document.write("&lt;p&gt;Ilość wykonania pętli = " + ile_razy_kap + "&lt;/p&gt;");
document.write("&lt;p&gt;Wielkość liter = " + wielkosc_liter_kap + "px&lt;/p&gt;");
document.write("&lt;hr&gt;");

if(liczba_kap % 2 == 0) {
    // parzysta - wyświetl nazwisko
    document.write("&lt;span style='color:blue;'&gt;");
    for(i_kap=1; i_kap&lt;=ile_razy_kap; i_kap++) {
        document.write(i_kap + ". Kapral&lt;br&gt;");
    }
    document.write("&lt;/span&gt;");
} else {
    // nieparzysta - wyświetl imię
    document.write("&lt;span style='color:green;'&gt;");
    for(i_kap=1; i_kap&lt;=ile_razy_kap; i_kap++) {
        document.write(i_kap + ". Antoni&lt;br&gt;");
    }
    document.write("&lt;/span&gt;");
}

document.write("&lt;/div&gt;");

function okno_zamknij_kapral() {
    window.close();
}
    &lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/&gt;
&lt;/body&gt;
&lt;/html&gt;
    </textarea>
    <br><br>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/>
</body>
</html>
