<body>
    <h2>Kod programu - Zadanie 43</h2>
    <textarea cols="90" rows="20">
&lt;!DOCTYPE html&gt;
&lt;html lang="pl-PL"&gt;
&lt;head&gt;
    &lt;title&gt;Zadanie 43 - Kapral&lt;/title&gt;
    &lt;meta charset="utf-8"&gt;
    &lt;script language="JavaScript"&gt;
// Antoni Kapral 3F - 2.8.2025
// Zadanie 43 - Wypisz wszystkie liczby parzyste od 2 do wczytanej

var koniec_petli_kap = prompt("Podaj koniec pętli (liczbę):", "");
var koniec_kap = parseFloat(koniec_petli_kap);

document.write("&lt;div style='color:blue; font-size:20px;'&gt;");
document.write("&lt;h2&gt;Liczby parzyste od 2 do " + koniec_kap + ":&lt;/h2&gt;");

for(i_kap=2; i_kap&lt;=koniec_kap; i_kap++) {
    if(i_kap % 2 == 0) {
        document.write(i_kap + "&lt;br&gt;");
    }
}

document.write("&lt;/div&gt;");

function okno_zamknij_kapral() {
    window.close();
}
    &lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/&gt;
&lt;/body&gt;
&lt;/html&gt;
    </textarea>
    <br><br>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/>
</body>
</html>
