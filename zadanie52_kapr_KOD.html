<head>

        function okno_zamknij_kapral() {
            window.close();
        }
    </script>
</head>
<body>
    <h2>Kod programu - Zadanie 52</h2>
    <textarea cols="90" rows="35">
&lt;!DOCTYPE html&gt;
&lt;html lang="pl"&gt;
&lt;head&gt;
    &lt;meta charset="utf-8"&gt;
    &lt;title&gt;Zadanie 52 - Kapral&lt;/title&gt;
    &lt;style&gt;
        body { font-family: monospace; font-size: 16px; }
    &lt;/style&gt;
    &lt;script language="JavaScript"&gt;
// Antoni Kapral 3F - 2.8.2025
// Zadanie 52 - Rysowanie prostokąta z gwiazdek (3 pętle)

var liczba_liter_nazwiska = 6; // KAPRAL = 6 liter
var liczba_liter_imienia = 6; // ANTONI = 6 liter

var a_kap = (liczba_liter_nazwiska % 4) + 5;
var b_kap = (liczba_liter_imienia % 6) + 20;

document.write("&lt;div style='color:red; font-size:2cm;'&gt;");
document.write("Antoni Kapral&lt;br&gt;");
document.write("&lt;/div&gt;");

document.write("&lt;div style='color:blue; font-size:5mm;'&gt;");
document.write("Zadanie 52 - Rysowanie prostokąta (3 pętle)&lt;br&gt;");
document.write("a = " + a_kap + ", b = " + b_kap + "&lt;br&gt;&lt;br&gt;");
document.write("&lt;/div&gt;");

// Pierwsza pętla - górne poziome gwiazdki
for(var i_kap=1; i_kap&lt;=b_kap; i_kap++) {
    document.write("* ");
}
document.write("&lt;br&gt;");

// Druga pętla - środkowe gwiazdki (pionowe)
for(var i_kap=1; i_kap&lt;=a_kap-2; i_kap++) {
    document.write("*");
    for(var j_kap=1; j_kap&lt;=b_kap*2-3; j_kap++) {
        document.write("&amp;nbsp;");
    }
    document.write("*&lt;br&gt;");
}

// Trzecia pętla - dolne poziome gwiazdki
if(a_kap &gt; 1) {
    for(var i_kap=1; i_kap&lt;=b_kap; i_kap++) {
        document.write("* ");
    }
    document.write("&lt;br&gt;");
}

function okno_zamknij_kapral() {
    window.close();
}
    &lt;/script&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/&gt;
&lt;/body&gt;
&lt;/html&gt;
    </textarea>
    <br><br>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/>
</body>
</html>
