<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 54 - Kapral</title>
    <style>
        body { font-family: monospace; font-size: 16px; }
    </style>
    <script language="JavaScript">
        // Antoni Kapral 3F - 2.8.2025
        // Zadanie 54 - Rysowanie pionowego prostokąta
        
        var imie_kap = prompt("Podaj swoje imię:", "");
        var nazwisko_kap = prompt("Podaj swoje nazwisko:", "");
        
        var liczba_liter_nazwiska = nazwisko_kap.length;
        var liczba_liter_imienia = imie_kap.length;
        
        var a_kap = (liczba_liter_nazwiska % 4) + 5;
        var b_kap = (liczba_liter_imienia % 6) + 20;
        
        document.write("<h2>Zadanie 54 - Antoni Kapral</h2>");
        document.write("Imię: " + imie_kap + ", Nazwisko: " + nazwisko_kap + "<br>");
        document.write("a = " + a_kap + ", b = " + b_kap + "<br><br>");
        
        // Rysowanie prostokąta PIONOWEGO (a - wysokość, b - szerokość)
        for(var i_kap=1; i_kap<=a_kap; i_kap++) {
            document.write("*");
            if(b_kap > 1) {
                for(var j_kap=1; j_kap<=b_kap-2; j_kap++) {
                    document.write("&nbsp;&nbsp;");
                }
                document.write("*");
            }
            document.write("<br>");
        }
        
        function okno_zamknij_kapral() {
            window.close();
        }
    </script>
</head>
<body>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kapral()"/>
</body>
</html>
